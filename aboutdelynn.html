<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>About Delynn</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Poppins', sans-serif;
            }

            nav {
                display: flex;
                justify-content: flex-end;
                align-items: center;
                gap: 40px;
                background-color: #ffffff;
                padding: 20px 60px;
            }

            nav a {
                text-decoration: none;
                color: #333;
                font-size: 16px;
                font-weight: 600;
                letter-spacing: 1px;
                padding-bottom: 4px;
                border-bottom: 2px solid transparent;
                transition: color 0.3s ease, border-color 0.3s ease;
            }

            nav a:hover {
                color: #b67dc5;
            }

            nav a.active {
                color: #b67dc5;
                border-bottom: 2px solid #b67dc5;
            }

            .hero {
                position: relative;
                min-height: 90vh;
                background-image: url("delynnui.jpg");
                background-size: cover;
                background-position: top center;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .hero::before {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(120deg, rgba(182, 125, 197, 0.75), rgba(240, 190, 160, 0.55));
            }

            .hero-content {
                position: relative;
                z-index: 1;
                padding: 0 80px;
                max-width: 800px;
                text-align: center;
            }

            .hero-content h1 {
                font-family: 'Baloo 2', sans-serif;
                font-weight: 800;
                font-size: 100px;
                line-height: 1.1;
                color: #ffffff;
                text-transform: uppercase;
            }

            .hero-content p {
                margin-top: 25px;
                font-size: 24px;
                color: #ffffff;
            }
        </style>
    </head>
    <body>

        <nav>
            <a href="index.html" class="active">HOME</a>
            <a href="profile.html">PROFILE</a>
        </nav>

        <section class="hero">
            <div class="hero-content">
                <h1>About<br>Delynn</h1>
                <p>-Kenali lebih dekat Delynn JKT48-</p>
            </div>
        </section>
        <script>
    let sudahPindah = false;

    window.addEventListener('scroll', () => {
        if (sudahPindah) return;

        const posisiScroll = window.innerHeight + window.scrollY;
        const tinggiHalaman = document.body.offsetHeight;

        if (posisiScroll >= tinggiHalaman - 50) {
            sudahPindah = true;
            window.location.href = "profile.html";
        }
    });
        </script>

    </body>
</html>
